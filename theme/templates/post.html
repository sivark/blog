{% extends "base.html" %}

{% block content %}
  <article class="post">
    <header class="post-header">
      {% if post.date %}<div class="post-meta">{{ post.date | strftime("%b %d, %Y") }}</div>{% endif %}
      <h1 class="post-title-main">{{ post.title }}</h1>
    </header>

    <div class="post-body">
      {{ post.html | safe }}
    </div>
  </article>
{% endblock %}
