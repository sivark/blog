{% extends "base.html" %}

{% block content %}
  <article class="post">
    <header class="post-header mb-10 pb-6 border-b border-slate-200 dark:border-slate-800">
      <div class="post-meta">
        {% if post.date %}
          <time class="post-date" datetime="{{ post.date | strftime("%Y-%m-%d") }}">{{ post.date | strftime("%Y %B %d") }}</time>
        {% endif %}
        {% if post.filetags %}
          {% if post.date %}<span class="post-meta-separator">•</span>{% endif %}
          <div class="post-tags">
            {% for tag in post.filetags %}
              <a href="index.html#tag={{ tag }}" class="post-tag">
                #{{ tag }}
              </a>
            {% endfor %}
          </div>
        {% endif %}
      </div>
      <h1 class="post-title-main">{{ post.title }}</h1>
    </header>

    <div class="post-body">
      {{ post.html | safe }}
    </div>
  </article>
{% endblock %}
