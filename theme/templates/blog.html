{% extends "base.html" %}

{% block content %}
  <h1 style="font-size: 1rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--accent); margin-bottom: 3rem;">Posts</h1>

  <ul class="posts">
    {% for post in posts %}
      <li class="post-title">
        <a href="{{ post.slug }}.html">{{ post.title }}</a>
        <div class="post-date">{% if post.date %}{{ post.date | strftime("%b %d, %Y") }}{% endif %}</div>
      </li>
    {% endfor %}
  </ul>
{% endblock %}
