{% extends "base.html" %}

{% block content %}
  <div class="section-label mb-8">Posts</div>

  <ul class="posts">
    {% for post in posts %}
      <li class="post-item group">
        {% if post.date %}<div class="post-date">{{ post.date | strftime("%b %d, %Y") }}</div>{% endif %}
        <h2 class="post-title">
          <a href="{{ post.slug }}.html">{{ post.title }}</a>
        </h2>
      </li>
    {% endfor %}
  </ul>
{% endblock %}
